[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eistara"
version = "0.1.0"
description = "Eistara video translation and dubbing pipeline"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0.0",
    "PyYAML>=6.0.2",
    "json-repair>=0.30.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "pydub>=0.25.1",
    "requests>=2.32.0",
    "soundfile>=0.13.0",
    "spacy>=3.8.0",
    "yt-dlp>=2025.1.0",
]

[project.optional-dependencies]
webui = [
    "streamlit>=1.36.0",
    "Pillow>=10.0.0",
]
asr = [
    "faster-whisper>=1.1.0",
    "huggingface-hub>=0.36,<1.0",
    "librosa>=0.11.0",
    "whisperx==3.8.6",
]

[tool.setuptools.packages.find]
include = ["eistara*", "apps*"]

[tool.ruff]
line-length = 120
